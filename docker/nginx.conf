limit_req_zone $binary_remote_addr zone=analysis:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    location /api/workspace/ {
        limit_req zone=analysis burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/workspace/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store" always;
    }

    location = /api/health {
        proxy_pass http://api:8000/health;
        add_header Cache-Control "no-store" always;
    }

    location /api/ { return 404; }

    # Vite emits fingerprinted assets, so browsers may cache them indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Keep deep links such as /overview and /network inside the React app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
