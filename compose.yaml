name: x-tracer

services:
  web:
    build:
      context: .
      target: frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "${WEB_PORT:-4179}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      API_KEY: ${API_KEY:-dev-key-change-me}
      FRONTEND_ORIGINS: http://localhost:4179,http://127.0.0.1:4179
      CAVIAR_DIR: out_caviar
      ENRON_DIR: out_enron
      ENRON_MAX_EDGES: "5000"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_REQUIRE_AUTH: ${SUPABASE_REQUIRE_AUTH:-false}
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    expose:
      - "8000"
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    profiles: ["neo4j"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-this-password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

volumes:
  neo4j-data:
