name: x-tracer

services:
  web:
    build:
      context: .
      target: frontend
    ports:
      - "${WEB_PORT:-4179}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      API_KEY: ${API_KEY:-dev-key-change-me}
      FRONTEND_ORIGINS: http://localhost:4179,http://127.0.0.1:4179
      CAVIAR_DIR: out_caviar
      ENRON_DIR: out_enron
      ENRON_MAX_EDGES: "5000"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    expose:
      - "8000"
    restart: unless-stopped
